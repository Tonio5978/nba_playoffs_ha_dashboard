button_card_templates:
  nba_next_game:
    custom_fields:
      rotate: |
        [[[
          const a = entity.attributes;
          const status = a.series_status || "";
          let next = "";

          if (a.next_game_time) {
            const d = new Date(a.next_game_time);
            const now = new Date();
            const isToday = d.getFullYear() === now.getFullYear() &&
                            d.getMonth() === now.getMonth() &&
                            d.getDate() === now.getDate();

            if (isToday) {
              next = `Game · ${d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}`;
            } else {
              next = `Game · ${d.toLocaleDateString([], { weekday: 'short' })} ${d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}`;
            }
          }

          if (!next) {
            return `
              <div class="fade-rotator no-anim">
                <div class="fade-item" style="opacity:1">${status}</div>
              </div>
            `;
          }
          return `
            <div class="fade-rotator">
              <div class="fade-item item1">${status}</div>
              <div class="fade-item item2">${next}</div>
            </div>
          `;
        ]]]

  nba_series_card:
    template:
      - nba_next_game
      - nba_theme_series
      - nba_css
    show_icon: false
    show_name: false
    show_state: false
    custom_fields:
      l1: |
        [[[
          const logo = entity.attributes.team1_logo;
          if (!logo) return `<div style="width:80px;height:80px;background:rgba(255,255,255,0.1);border-radius:50%;"></div>`;
          return `<img src="${logo}" height="80">`;
        ]]]
      l2: |
        [[[
          const logo = entity.attributes.team2_logo;
          if (!logo) return `<div style="width:80px;height:80px;background:rgba(255,255,255,0.1);border-radius:50%;"></div>`;
          return `<img src="${logo}" height="80">`;
        ]]]
      s1: |
        [[[
          const seed = entity.attributes.team1_seed;
          return seed && seed !== 0 ? seed : "";
        ]]]
      s2: |
        [[[
          const seed = entity.attributes.team2_seed;
          return seed && seed !== 0 ? seed : "";
        ]]]
      n1: |
        [[[
          const full = entity.attributes.team1_name || "";
          return full.split(" ").pop();
        ]]]
      n2: |
        [[[
          const full = entity.attributes.team2_name || "";
          return full.split(" ").pop();
        ]]]
    styles:
      card:
        - border-radius: 14px
        - padding: 1vh
        - display: flex
        - flex-direction: column
        - justify-content: center
        - align-items: center
        - background: rgba(0,0,0,0.2)
      grid:
        - grid-template-areas: |
            "rotate rotate rotate"
            "l1 . l2"
            "s1 . s2"
            "n1 . n2"
        - grid-template-columns: 1fr min-content 1fr
        - grid-template-rows: auto 1fr auto auto
      custom_fields:
        rotate:
          - grid-area: rotate
          - height: 2.8vh
          - font-size: 2.2vh
          - font-weight: bold
          - color: white
          - text-align: center
          - margin-bottom: 0.5vh
          - position: relative
        l1:
          - grid-area: l1
          - justify-self: center
          - align-self: center
        l2:
          - grid-area: l2
          - justify-self: center
          - align-self: center
        s1:
          - grid-area: s1
          - font-size: 2vh
          - color: white
          - justify-self: center
          - margin-top: 0.2vh
        s2:
          - grid-area: s2
          - font-size: 2vh
          - color: white
          - justify-self: center
          - margin-top: 0.2vh
        n1:
          - grid-area: n1
          - font-size: 2vh
          - color: white
          - justify-self: center
          - white-space: normal
          - text-align: center
          - padding: 0 0.5vh
        n2:
          - grid-area: n2
          - font-size: 2vh
          - color: white
          - justify-self: center
          - white-space: normal
          - text-align: center
          - padding: 0 0.5vh

  nba_live_card:
    template:
      - nba_theme_live
      - nba_css
    show_icon: false
    show_name: false
    show_state: false
    custom_fields:
      bg1: |
        [[[
          const logo = entity.attributes.away_logo;
          return `<img src="${logo}" style="height:220px; opacity:0.07; filter:grayscale(100%);">`;
        ]]]
      bg2: |
        [[[
          const logo = entity.attributes.home_logo;
          return `<img src="${logo}" style="height:220px; opacity:0.07; filter:grayscale(100%);">`;
        ]]]
      series: |
        [[[
          const sid = entity.entity_id.replace("nba_live", "nba_series");
          const a = states[sid] ? states[sid].attributes : {};
          const w1 = a.team1_wins || 0;
          const w2 = a.team2_wins || 0;
          const t1 = a.team1_abbrev || "";
          const t2 = a.team2_abbrev || "";
          if (w1 === 4 || w2 === 4) return w1 > w2 ? `${t1} wins ${w1}–${w2}` : `${t2} wins ${w2}–${w1}`;
          if (w1 > w2) return `${t1} leads ${w1}–${w2}`;
          if (w2 > w1) return `${t2} leads ${w2}–${w1}`;
          return w1 + w2 > 0 ? `Tied ${w1}–${w2}` : "Series tied 0–0";
        ]]]
      score: |
        [[[
          const a = entity.attributes;
          return `${a.away_score} - ${a.home_score}`;
        ]]]
      status: |
        [[[
          const a = entity.attributes;
          const state = (a.game_state || "").toLowerCase();
          if (state === "pre") {
            if (a.start_time) {
              const d = new Date(a.start_time);
              return `Tip-off ${d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}`;
            }
            return "Pre-Game";
          }
          if (state === "post") {
            const q = a.quarter || 0;
            if (q > 4) {
              const ot = q - 4;
              return ot === 1 ? "Final/OT" : `Final/${ot}OT`;
            }
            return "Final";
          }
          // in progress
          const q = a.quarter_display || "";
          const clock = a.time_remaining || "";
          return q && clock ? `${q} · ${clock}` : (q || clock || "Live");
        ]]]
      abbrev: |
        [[[
          const a = entity.attributes;
          return `
            <div style="height: 3vh; line-height: 3vh; display: flex; align-items: center; width: 100%;">
              <div style="display: grid; grid-template-columns: 1fr auto 1fr; width: 100%; align-items: center; justify-items: center; gap: 1vh;">
                <div style="justify-self: end; text-align: right; width: 100%;">${a.away_abbr || a.away_team || ""}</div>
                <div style="color: rgba(255,255,255,0.6); font-weight: 500; font-size: 2.1vh;">vs</div>
                <div style="justify-self: start; text-align: left; width: 100%;">${a.home_abbr || a.home_team || ""}</div>
              </div>
            </div>
          `;
        ]]]
    styles:
      card:
        - border-radius: 14px
        - padding: 1vh
        - display: flex
        - flex-direction: column
        - justify-content: center
        - align-items: center
      grid:
        - grid-template-areas: |
            "series series series"
            "bg1 score bg2"
            "bg1 status bg2"
            "bg1 abbrev bg2"
        - grid-template-columns: 1fr auto 1fr
        - grid-template-rows: auto 1fr auto auto
      custom_fields:
        series:
          - grid-area: series
          - font-size: 2.0vh
          - font-weight: bold
          - text-align: center
          - margin-bottom: 0.5vh
          - z-index: 3
          - color: white
        bg1:
          - position: absolute
          - top: 50%
          - left: 0
          - transform: translate(-45%, -50%)
          - pointer-events: none
          - z-index: 1
        bg2:
          - position: absolute
          - top: 50%
          - right: 0
          - transform: translate(45%, -50%)
          - pointer-events: none
          - z-index: 1
        score:
          - grid-area: score
          - font-size: 5.2vh
          - font-weight: bold
          - text-align: center
          - z-index: 2
        status:
          - grid-area: status
          - font-size: 2.2vh
          - text-align: center
          - margin-top: '-0.8vh'
          - z-index: 2
        abbrev:
          - grid-area: abbrev
          - font-size: 2.2vh
          - margin-top: 0.5vh
          - z-index: 2
          - width: 100%
          - min-width: 140px

  nba_title_bar:
    show_icon: false
    show_name: true
    show_state: false
    styles:
      card:
        - background: none
        - border: none
        - box-shadow: none
        - padding: 0
        - height: 32px
        - display: flex
        - justify-content: center
        - align-items: center
      name:
        - font-size: 20px
        - font-weight: bold
        - color: white
        - text-align: center

  nba_theme_series:
    styles:
      card:
        - height: |
            [[[
              const rd = variables.round;
              if (rd === "4") return "28vh";
              if (rd === "3") return "22vh";
              return "18vh";
            ]]]
        - background: |
            [[[
              const sd = variables.side;
              if (sd === "finals") return "radial-gradient(circle, rgba(20,15,5,0.95) 0%, rgba(30,22,5,0.7) 60%, rgba(0,0,0,0.3) 100%)";
              return "radial-gradient(circle, rgba(10,10,10,0.9) 0%, rgba(15,15,15,0.6) 50%, rgba(0,0,0,0.3) 100%)";
            ]]]
        - overflow: hidden
        - border: |
            [[[
              const sd = variables.side;
              const rd = variables.round;
              if (rd === "4" || sd === "finals") return "rgba(255, 215, 0, 0.8) 2px solid";
              const isW = sd === "west";
              const west = "rgba(29,66,138,";
              const east = "rgba(206,17,65,";
              const base = isW ? west : east;
              if (rd === "3" || rd === "cf") return base + "0.9) 2px solid";
              if (rd === "2") return base + "0.8) 2px solid";
              return base + "0.7) 2px solid";
            ]]]
        - box-shadow: |
            [[[
              const sd = variables.side;
              const rd = variables.round;
              if (rd === "4" || sd === "finals") return "inset 0 0 20px 4px rgba(255, 215, 0, 0.55)";
              const isW = sd === "west";
              return isW ? "inset 0 0 20px 4px rgba(29,66,138,0.6)" : "inset 0 0 20px 4px rgba(206,17,65,0.6)";
            ]]]

  nba_theme_live:
    styles:
      card:
        - height: |
            [[[
              const rd = variables.round;
              if (rd === "4") return "30vh";
              if (rd === "3") return "24vh";
              return "20vh";
            ]]]
        - background: >-
            radial-gradient(circle, rgba(10,10,10,0.9) 0%, rgba(15,15,15,0.6)
            50%, rgba(0,0,0,0.3) 100%)
        - overflow: hidden
        - border: |
            [[[
              const sd = variables.side;
              const rd = variables.round;
              if (rd === "4" || sd === "finals") return "rgba(255, 215, 0, 0.8) 2px solid";
              const isW = sd === "west";
              const west = "rgba(29,66,138,";
              const east = "rgba(206,17,65,";
              const base = isW ? west : east;
              if (rd === "3" || rd === "cf") return base + "0.9) 2px solid";
              if (rd === "2") return base + "0.8) 2px solid";
              return base + "0.7) 2px solid";
            ]]]
        - box-shadow: |
            [[[
              const sd = variables.side;
              const rd = variables.round;
              if (rd === "4" || sd === "finals") return "inset 0 0 20px 4px rgba(255, 215, 0, 0.55)";
              const isW = sd === "west";
              return isW ? "inset 0 0 20px 4px rgba(29,66,138,0.6)" : "inset 0 0 20px 4px rgba(206,17,65,0.6)";
            ]]]

  nba_css:
    extra_styles: |
      @keyframes fadeInOut {
        0%   { opacity: 0; }
        10%  { opacity: 1; }
        40%  { opacity: 1; }
        50%  { opacity: 0; }
        60%  { opacity: 0; }
        90%  { opacity: 1; }
        100% { opacity: 0; }
      }
      .fade-rotator { position: relative; width: 100%; overflow: hidden; }
      .fade-item { position: absolute; width: 100%; text-align: center; opacity: 0; }
      .fade-rotator:not(.no-anim) .item1 {
        animation: fadeInOut 8s ease-in-out infinite;
      }
      .fade-rotator:not(.no-anim) .item2 {
        animation: fadeInOut 8s ease-in-out infinite 4s;
      }
      .fade-rotator.no-anim .fade-item { position: relative; opacity: 1; }

  # Dynamically switches between live_card and series_card based on sensor state
  tournament_game_logic:
    variables:
      side: west
      round: '1'
      game_num: '1'
    styles:
      grid:
        - grid-template-areas: '"main"'
      card:
        - padding: 0px
    custom_fields:
      main:
        card:
          type: custom:button-card
          template: |
            [[[
              const sd = variables.side;
              const rd = variables.round;
              const num = variables.game_num;
              let live_id;
              if (rd === "4" || sd === "finals") {
                live_id = "sensor.nba_live_r4_final";
              } else if (rd === "3" || rd === "cf") {
                live_id = `sensor.nba_live_r3_${sd}_cf`;
              } else {
                live_id = `sensor.nba_live_r${rd}_${sd}_${num}`;
              }
              return (states[live_id]?.state === 'live') ? 'nba_live_card' : 'nba_series_card';
            ]]]
          entity: |
            [[[
              const sd = variables.side;
              const rd = variables.round;
              const num = variables.game_num;
              let live_id, series_id;
              if (rd === "4" || sd === "finals") {
                live_id = "sensor.nba_live_r4_final";
                series_id = "sensor.nba_series_r4_final";
              } else if (rd === "3" || rd === "cf") {
                live_id = `sensor.nba_live_r3_${sd}_cf`;
                series_id = `sensor.nba_series_r3_${sd}_cf`;
              } else {
                live_id = `sensor.nba_live_r${rd}_${sd}_${num}`;
                series_id = `sensor.nba_series_r${rd}_${sd}_${num}`;
              }
              return (states[live_id]?.state === 'live') ? live_id : series_id;
            ]]]
          variables:
            round: |
              [[[ return variables.round; ]]]
            side: |
              [[[ return variables.side; ]]]

title: NBA Playoffs 2026
views:
  - title: Bracket
    path: nba-playoffs
    type: panel
    cards:
      - type: custom:button-card
        name: " "
        styles:
          card:
            - background: >-
                linear-gradient(135deg,
                rgba(29,66,138,0.85) 0%,
                rgba(0,0,0,0.95) 40%,
                rgba(0,0,0,0.95) 60%,
                rgba(206,17,65,0.85) 100%)
            - min-height: 100vh
            - padding: 1vh 1vw
        custom_fields:
          bracket:
            card:
              type: vertical-stack
              cards:
                # ── Season Title ──────────────────────────────────────────
                - type: custom:button-card
                  name: "🏀 2026 NBA PLAYOFFS"
                  template: nba_title_bar
                  styles:
                    card:
                      - height: 50px
                      - margin-bottom: 1vh

                # ── Conference Headers ────────────────────────────────────
                - type: horizontal-stack
                  cards:
                    - type: custom:button-card
                      name: WESTERN CONFERENCE
                      template: nba_title_bar
                      styles:
                        card:
                          - background: "linear-gradient(to right, rgba(29,66,138,0.9), rgba(29,66,138,0.3))"
                          - border-radius: 8px
                          - height: 36px
                    - type: custom:button-card
                      name: " "
                      styles:
                        card:
                          - background: none
                          - border: none
                          - box-shadow: none
                          - max-width: 80px
                    - type: custom:button-card
                      name: EASTERN CONFERENCE
                      template: nba_title_bar
                      styles:
                        card:
                          - background: "linear-gradient(to left, rgba(206,17,65,0.9), rgba(206,17,65,0.3))"
                          - border-radius: 8px
                          - height: 36px

                # ── Main Bracket Grid ─────────────────────────────────────
                - type: horizontal-stack
                  cards:

                    # ── WEST R1 ──────────────────────────────────────
                    - type: vertical-stack
                      cards:
                        - type: custom:button-card
                          template: tournament_game_logic
                          variables:
                            side: west
                            round: '1'
                            game_num: '1'
                        - type: custom:button-card
                          template: tournament_game_logic
                          variables:
                            side: west
                            round: '1'
                            game_num: '2'
                        - type: custom:button-card
                          template: tournament_game_logic
                          variables:
                            side: west
                            round: '1'
                            game_num: '3'
                        - type: custom:button-card
                          template: tournament_game_logic
                          variables:
                            side: west
                            round: '1'
                            game_num: '4'

                    # ── WEST R2 + CF ──────────────────────────────────
                    - type: vertical-stack
                      cards:
                        - type: custom:button-card
                          template: tournament_game_logic
                          variables:
                            side: west
                            round: '2'
                            game_num: '1'
                        - type: custom:button-card
                          template: nba_title_bar
                          name: "WEST"
                          styles:
                            card:
                              - height: 2vh
                        - type: custom:button-card
                          template: tournament_game_logic
                          variables:
                            side: west
                            round: '3'
                            game_num: '1'
                        - type: custom:button-card
                          template: nba_title_bar
                          name: "CONF FINALS"
                          styles:
                            card:
                              - height: 2vh
                        - type: custom:button-card
                          template: tournament_game_logic
                          variables:
                            side: west
                            round: '2'
                            game_num: '2'

                    # ── NBA FINALS (center) ───────────────────────────
                    - type: vertical-stack
                      cards:
                        - type: custom:button-card
                          name: "🏆 NBA FINALS"
                          template: nba_title_bar
                          styles:
                            card:
                              - height: 4vh
                        - type: custom:button-card
                          template: tournament_game_logic
                          variables:
                            side: finals
                            round: '4'
                            game_num: '1'

                    # ── EAST R2 + CF ──────────────────────────────────
                    - type: vertical-stack
                      cards:
                        - type: custom:button-card
                          template: tournament_game_logic
                          variables:
                            side: east
                            round: '2'
                            game_num: '1'
                        - type: custom:button-card
                          template: nba_title_bar
                          name: "EAST"
                          styles:
                            card:
                              - height: 2vh
                        - type: custom:button-card
                          template: tournament_game_logic
                          variables:
                            side: east
                            round: '3'
                            game_num: '1'
                        - type: custom:button-card
                          template: nba_title_bar
                          name: "CONF FINALS"
                          styles:
                            card:
                              - height: 2vh
                        - type: custom:button-card
                          template: tournament_game_logic
                          variables:
                            side: east
                            round: '2'
                            game_num: '2'

                    # ── EAST R1 ───────────────────────────────────────
                    - type: vertical-stack
                      cards:
                        - type: custom:button-card
                          template: tournament_game_logic
                          variables:
                            side: east
                            round: '1'
                            game_num: '1'
                        - type: custom:button-card
                          template: tournament_game_logic
                          variables:
                            side: east
                            round: '1'
                            game_num: '2'
                        - type: custom:button-card
                          template: tournament_game_logic
                          variables:
                            side: east
                            round: '1'
                            game_num: '3'
                        - type: custom:button-card
                          template: tournament_game_logic
                          variables:
                            side: east
                            round: '1'
                            game_num: '4'
