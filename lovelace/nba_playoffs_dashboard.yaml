button_card_templates:

  # ─────────────────────────────────────────────────────────────────────────
  # ROTATE : statut série + prochain match (alterne toutes les 5 s)
  # ─────────────────────────────────────────────────────────────────────────
  nba_next_game:
    custom_fields:
      rotate: |
        [[[
          const a = entity.attributes;
          const status = a.series_status || "";
          let next = "";

          if (a.next_game_time) {
            const d = new Date(a.next_game_time);
            const now = new Date();
            const isToday = d.getFullYear() === now.getFullYear() &&
                            d.getMonth()    === now.getMonth()    &&
                            d.getDate()     === now.getDate();

            if (isToday) {
              next = `Game · ${d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}`;
            } else {
              next = `Game · ${d.toLocaleDateString([], { weekday: 'short' })} ${d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}`;
            }
          }

          if (!next) {
            return `<div class="fade-rotator no-anim"><div class="fade-item" style="opacity:1">${status}</div></div>`;
          }
          return `
            <div class="fade-rotator">
              <div class="fade-item item1">${status}</div>
              <div class="fade-item item2">${next}</div>
            </div>`;
        ]]]

  # ─────────────────────────────────────────────────────────────────────────
  # SERIES CARD
  # ─────────────────────────────────────────────────────────────────────────
  nba_series_card:
    template:
      - nba_next_game
      - nba_theme_series
      - nba_css
    show_icon: false
    show_name: false
    show_state: false
    custom_fields:
      l1: |
        [[[
          const logo = entity.attributes.team1_logo;
          if (!logo) return `<div style="width:80px;height:80px;background:rgba(255,255,255,0.1);border-radius:50%;"></div>`;
          return `<img src="${logo}" height="80">`;
        ]]]
      l2: |
        [[[
          const logo = entity.attributes.team2_logo;
          if (!logo) return `<div style="width:80px;height:80px;background:rgba(255,255,255,0.1);border-radius:50%;"></div>`;
          return `<img src="${logo}" height="80">`;
        ]]]
      n1: |
        [[[
          const full = entity.attributes.team1_name || "";
          return full.split(" ").pop();
        ]]]
      n2: |
        [[[
          const full = entity.attributes.team2_name || "";
          return full.split(" ").pop();
        ]]]
    styles:
      card:
        - border-radius: 14px
        - padding: 1vh
        - display: flex
        - flex-direction: column
        - justify-content: center
        - align-items: center
        - background: rgba(0,0,0,0.2)
      grid:
        - grid-template-areas: |
            "rotate rotate rotate"
            "l1 . l2"
            "n1 . n2"
        - grid-template-columns: 1fr min-content 1fr
        - grid-template-rows: auto 1fr auto
      custom_fields:
        rotate:
          - grid-area: rotate
          - height: 2.8vh
          - font-size: 2.2vh
          - font-weight: bold
          - color: white
          - text-align: center
          - margin-bottom: 0.5vh
          - position: relative
        l1:
          - grid-area: l1
          - justify-self: center
          - align-self: center
        l2:
          - grid-area: l2
          - justify-self: center
          - align-self: center
        s1:
          - grid-area: s1
          - font-size: 2vh
          - color: white
          - justify-self: center
          - margin-top: 0.2vh
        s2:
          - grid-area: s2
          - font-size: 2vh
          - color: white
          - justify-self: center
          - margin-top: 0.2vh
        n1:
          - grid-area: n1
          - font-size: 2vh
          - color: white
          - justify-self: center
          - white-space: normal
          - text-align: center
          - padding: 0 0.5vh
        n2:
          - grid-area: n2
          - font-size: 2vh
          - color: white
          - justify-self: center
          - white-space: normal
          - text-align: center
          - padding: 0 0.5vh

  # ─────────────────────────────────────────────────────────────────────────
  # LIVE CARD
  # ─────────────────────────────────────────────────────────────────────────
  nba_live_card:
    template:
      - nba_theme_live
      - nba_css
    show_icon: false
    show_name: false
    show_state: false
    custom_fields:
      corner_home: ''
      corner_away: ''
      bg1: |
        [[[
          const logo = entity.attributes.away_logo;
          return `<img src="${logo}" style="height:220px; opacity:0.07; filter:grayscale(100%);">`;
        ]]]
      bg2: |
        [[[
          const logo = entity.attributes.home_logo;
          return `<img src="${logo}" style="height:220px; opacity:0.07; filter:grayscale(100%);">`;
        ]]]
      series: |
        [[[
          const sid = entity.entity_id.replace("nba_live", "nba_series");
          const a = states[sid] ? states[sid].attributes : {};
          const w1 = a.team1_wins || 0;
          const w2 = a.team2_wins || 0;
          const t1 = a.team1_abbrev || "";
          const t2 = a.team2_abbrev || "";
          if (w1 === 4 || w2 === 4) return w1 > w2 ? `${t1} wins ${w1}–${w2}` : `${t2} wins ${w2}–${w1}`;
          if (w1 > w2) return `${t1} leads ${w1}–${w2}`;
          if (w2 > w1) return `${t2} leads ${w2}–${w1}`;
          return w1 + w2 > 0 ? `Tied ${w1}–${w2}` : "Series tied 0–0";
        ]]]
      score: |
        [[[
          const a = entity.attributes;
          return `${a.away_score} - ${a.home_score}`;
        ]]]
      status: |
        [[[
          const a = entity.attributes;
          const state = (a.game_state || "").toLowerCase();
          if (state === "pre") {
            if (a.start_time) {
              const d = new Date(a.start_time);
              return `Tip-off ${d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}`;
            }
            return "Pre-Game";
          }
          if (state === "post") {
            const q = a.quarter || 0;
            if (q > 4) {
              const ot = q - 4;
              return ot === 1 ? "Final/OT" : `Final/${ot}OT`;
            }
            return "Final";
          }
          const q = a.quarter_display || "";
          const clock = a.time_remaining || "";
          return q && clock ? `${q} · ${clock}` : (q || clock || "Live");
        ]]]
      abbrev: |
        [[[
          const a = entity.attributes;
          return `
            <div style="height: 3vh; line-height: 3vh; display: flex; align-items: center; width: 100%;">
              <div style="display: grid; grid-template-columns: 1fr auto 1fr; width: 100%; align-items: center; justify-items: center; gap: 1vh;">
                <div style="justify-self: end; text-align: right; width: 100%;">${a.away_abbr || a.away_team || ""}</div>
                <div style="color: rgba(255,255,255,0.6); font-weight: 500; font-size: 2.1vh;">vs</div>
                <div style="justify-self: start; text-align: left; width: 100%;">${a.home_abbr || a.home_team || ""}</div>
              </div>
            </div>`;
        ]]]
    styles:
      card:
        - border-radius: 14px
        - padding: 1vh
        - display: flex
        - flex-direction: column
        - justify-content: center
        - align-items: center
      grid:
        - grid-template-areas: |
            "series series series"
            "bg1 score bg2"
            "bg1 status bg2"
            "bg1 abbrev bg2"
        - grid-template-columns: 1fr auto 1fr
        - grid-template-rows: auto 1fr auto auto
      custom_fields:
        series:
          - grid-area: series
          - font-size: 2.0vh
          - font-weight: bold
          - text-align: center
          - margin-bottom: 0.5vh
          - z-index: 3
          - color: white
        bg1:
          - position: absolute
          - top: 50%
          - left: 0
          - transform: translate(-45%, -50%)
          - pointer-events: none
          - z-index: 1
        bg2:
          - position: absolute
          - top: 50%
          - right: 0
          - transform: translate(45%, -50%)
          - pointer-events: none
          - z-index: 1
        score:
          - grid-area: score
          - font-size: 5.2vh
          - font-weight: bold
          - text-align: center
          - z-index: 2
        status:
          - grid-area: status
          - font-size: 2.2vh
          - text-align: center
          - margin-top: '-0.8vh'
          - z-index: 2
        abbrev:
          - grid-area: abbrev
          - font-size: 2.2vh
          - margin-top: 0.5vh
          - z-index: 2
          - width: 100%
          - min-width: 140px
        corner_home:
          - position: absolute
          - top: 0
          - right: 0
          - z-index: 1
          - width: 0px
          - height: 0px
        corner_away:
          - position: absolute
          - top: 0
          - left: 0
          - z-index: 1
          - width: 0px
          - height: 0px

  # ─────────────────────────────────────────────────────────────────────────
  # TITLE BAR
  # ─────────────────────────────────────────────────────────────────────────
  nba_title_bar:
    show_icon: false
    show_name: true
    show_state: false
    styles:
      card:
        - background: none
        - border: none
        - box-shadow: none
        - padding: 0
        - height: 32px
        - display: flex
        - justify-content: center
        - align-items: center
      name:
        - font-size: 20px
        - font-weight: bold
        - color: white
        - text-align: center

  # ─────────────────────────────────────────────────────────────────────────
  # ROUND 2 + CF DYNAMIC GRID  (identique au NHL, senseurs NBA)
  # ─────────────────────────────────────────────────────────────────────────
  round2_cf_grid:
    variables:
      side: west
    styles:
      card:
        - background: none
        - box-shadow: none
        - border: none
      grid:
        - grid-template-columns: 1fr 1fr 1fr 1fr
        - grid-template-rows: auto auto auto auto
        - grid-template-areas: |
            [[[
              const sd = variables.side;
              const isW = sd === 'west';
              const w1_n = isW ? 'r2w1' : 'r2e1';
              const w2_n = isW ? 'r2w2' : 'r2e2';
              const t_n  = isW ? 'w_title' : 'e_title';
              const f_n  = isW ? 'w_cf'    : 'e_cf';

              const w1_id = isW ? 'sensor.nba_live_r2_west_1' : 'sensor.nba_live_r2_east_1';
              const w2_id = isW ? 'sensor.nba_live_r2_west_2' : 'sensor.nba_live_r2_east_2';
              const f_id  = isW ? 'sensor.nba_live_r3_west_cf' : 'sensor.nba_live_r3_east_cf';

              const w1_live = states[w1_id]?.state === 'live';
              const w2_live = states[w2_id]?.state === 'live';
              const f_live  = states[f_id]?.state  === 'live';

              let row1 = w1_live ? `"${w1_n} ${w1_n} ${w1_n} ${w1_n}"` : isW ? `"${w1_n} ${w1_n} ${w1_n} ."` : `". ${w1_n} ${w1_n} ${w1_n}"`;
              let row2 = `"${t_n} ${t_n} ${t_n} ${t_n}"`;
              let row3 = f_live  ? `"${f_n}  ${f_n}  ${f_n}  ${f_n}"` : isW ? `". ${f_n} ${f_n} ${f_n}"` : `"${f_n} ${f_n} ${f_n} ."`;
              let row4 = w2_live ? `"${w2_n} ${w2_n} ${w2_n} ${w2_n}"` : isW ? `"${w2_n} ${w2_n} ${w2_n} ."` : `". ${w2_n} ${w2_n} ${w2_n}"`;

              return `${row1} ${row2} ${row3} ${row4}`;
            ]]]

  # ─────────────────────────────────────────────────────────────────────────
  # TOURNAMENT GAME LOGIC  (bascule series ↔ live)
  # ─────────────────────────────────────────────────────────────────────────
  tournament_game_logic:
    variables:
      side: west
      round: '1'
      game_num: '1'
    styles:
      grid:
        - grid-template-areas: '"main"'
      card:
        - padding: 0px
    custom_fields:
      main:
        card:
          type: custom:button-card
          template: |
            [[[
              const sd  = variables.side;
              const rd  = variables.round;
              const num = variables.game_num;
              const live_id = (rd === "4") ? "sensor.nba_live_r4_final"
                            : `sensor.nba_live_r${rd}_${sd}_${num}`;
              return (states[live_id]?.state === 'live') ? 'nba_live_card' : 'nba_series_card';
            ]]]
          entity: |
            [[[
              const sd  = variables.side;
              const rd  = variables.round;
              const num = variables.game_num;
              const live_id   = (rd === "4") ? "sensor.nba_live_r4_final"
                              : `sensor.nba_live_r${rd}_${sd}_${num}`;
              const series_id = (rd === "4") ? "sensor.nba_series_r4_final"
                              : `sensor.nba_series_r${rd}_${sd}_${num}`;
              return (states[live_id]?.state === 'live') ? live_id : series_id;
            ]]]
          variables:
            round: |
              [[[ return variables.round; ]]]
            side: |
              [[[ return variables.side; ]]]

  # ─────────────────────────────────────────────────────────────────────────
  # THEME SERIES
  # ─────────────────────────────────────────────────────────────────────────
  nba_theme_series:
    styles:
      card:
        - height: |
            [[[
              const rd = variables.round;
              if (rd === "4")  return "30vh";
              if (rd === "cf") return "24vh";
              if (rd === "2" || rd === "r2") return "20vh";
              return "20vh";
            ]]]
        - border: |
            [[[
              const sd = variables.side;
              const rd = variables.round;
              if (rd === "4") return "rgba(255, 215, 0, 0.8) 2px solid";
              const isW = sd === "west";
              const west = "rgba(29,66,138,";
              const east = "rgba(206,17,65,";
              const base = isW ? west : east;
              if (rd === "cf") return base + "0.8) 2px solid";
              if (rd === "2" || rd === "r2") return base + "0.7) 2px solid";
              return base + "0.6) 2px solid";
            ]]]
        - overflow: hidden
        - animation: |
            [[[
              const rd   = variables.round;
              const isW  = variables.side === "west";
              const t    = entity.attributes.next_game_time;
              if (!t) return "none";
              const d     = new Date(t);
              const today = new Date();
              const isToday = d.getFullYear() === today.getFullYear() &&
                              d.getMonth()    === today.getMonth()    &&
                              d.getDate()     === today.getDate();
              if (isToday) {
                if (rd === "4") return "pulse-gold 1.6s ease-in-out infinite";
                return isW ? "w_glow 1.6s ease-in-out infinite" : "e_glow 1.6s ease-in-out infinite";
              }
              return "none";
            ]]]

  # ─────────────────────────────────────────────────────────────────────────
  # THEME LIVE
  # ─────────────────────────────────────────────────────────────────────────
  nba_theme_live:
    styles:
      card:
        - height: |
            [[[
              const rd = variables.round;
              if (rd === "4") return "30vh";
              if (rd === "3") return "24vh";
              if (rd === "2" || rd === "r2") return "20vh";
              return "20vh";
            ]]]
        - background: >-
            radial-gradient(circle, rgba(10,10,10,0.9) 0%, rgba(15,15,15,0.6)
            50%, rgba(0,0,0,0.3) 100%)
        - overflow: hidden
        - border: |
            [[[
              const sd = variables.side;
              const rd = variables.round;
              if (rd === "4") return "rgba(255, 215, 0, 0.8) 2px solid";
              const isW = sd === "west";
              const west = "rgba(29,66,138,";
              const east = "rgba(206,17,65,";
              const base = isW ? west : east;
              if (rd === "cf") return base + "0.9) 2px solid";
              if (rd === "2" || rd === "r2") return base + "0.8) 2px solid";
              return base + "0.7) 2px solid";
            ]]]
        - box-shadow: |
            [[[
              if (variables.round === "4") return "inset 0 0 20px 4px rgba(255, 215, 0, 0.55)";
              const isW = variables.side === "west";
              return isW
                ? "inset 0 0 20px 4px rgba(29,66,138,0.6)"
                : "inset 0 0 20px 4px rgba(206,17,65,0.6)";
            ]]]

  # ─────────────────────────────────────────────────────────────────────────
  # CSS COMMUN  (animations fade + glow)
  # ─────────────────────────────────────────────────────────────────────────
  nba_css:
    extra_styles: >
      @keyframes fade1 {
        0%,10% { opacity: 1; }
        20%,60% { opacity: 0; }
        70%,100% { opacity: 1; }
      }

      @keyframes fade2 {
        0%,10% { opacity: 0; }
        20%,60% { opacity: 1; }
        70%,100% { opacity: 0; }
      }

      .fade-rotator { position: relative; height: 24px; }

      .fade-item { position: absolute; width: 100%; height: 24px; line-height:
      24px; left: 0; top: 0; }

      .fade-item.item1 { animation: fade1 10s infinite; }

      .fade-item.item2 { animation: fade2 10s infinite; }

      .fade-rotator.no-anim .fade-item { position: relative; opacity: 1; }


      @keyframes e_glow {
        0%   { box-shadow: inset 0 0 6px  1px rgba(206,17,65,0.4); }
        50%  { box-shadow: inset 0 0 20px 4px rgba(206,17,65,0.95); }
        100% { box-shadow: inset 0 0 6px  1px rgba(206,17,65,0.4); }
      }

      @keyframes w_glow {
        0%   { box-shadow: inset 0 0 6px  1px rgba(29,66,138,0.4); }
        50%  { box-shadow: inset 0 0 20px 4px rgba(29,66,138,0.95); }
        100% { box-shadow: inset 0 0 6px  1px rgba(29,66,138,0.4); }
      }

      @keyframes pulse-gold {
        0%   { box-shadow: inset 0 0 6px  1px rgba(255,215,0,0.3); }
        50%  { box-shadow: inset 0 0 20px 4px rgba(255,215,0,0.85); }
        100% { box-shadow: inset 0 0 6px  1px rgba(255,215,0,0.3); }
      }

# ─────────────────────────────────────────────────────────────────────────────
# BACKGROUND
# ─────────────────────────────────────────────────────────────────────────────
background:
  opacity: 20
  alignment: bottom center
  size: contain
  repeat: no-repeat
  attachment: fixed
  image:
    media_content_id: https://cdn.nba.com/logos/leagues/logo-nba.svg
    media_content_type: ''

# ─────────────────────────────────────────────────────────────────────────────
# VIEWS
# ─────────────────────────────────────────────────────────────────────────────
views:
  - panel: true
    cards:
      - type: grid
        columns: 5
        square: false
        cards:

          # ══════════════════════════════════════════════════════
          # COLONNE 1 — WEST R1
          # ══════════════════════════════════════════════════════
          - type: vertical-stack
            cards:
              - type: custom:button-card
                template: tournament_game_logic
                variables:
                  side: west
                  round: '1'
                  game_num: '1'
              - type: custom:button-card
                template: tournament_game_logic
                variables:
                  side: west
                  round: '1'
                  game_num: '2'
              - type: custom:button-card
                template: tournament_game_logic
                variables:
                  side: west
                  round: '1'
                  game_num: '3'
              - type: custom:button-card
                template: tournament_game_logic
                variables:
                  side: west
                  round: '1'
                  game_num: '4'

          # ══════════════════════════════════════════════════════
          # COLONNE 2 — WEST conf header + R2 + CF
          # ══════════════════════════════════════════════════════
          - type: vertical-stack
            cards:
              - type: custom:button-card
                name: WESTERN CONFERENCE
                show_icon: false
                show_state: false
                styles:
                  card:
                    - background: 'linear-gradient(180deg, #003B73 0%, #00264D 100%)'
                    - border: 2px solid rgba(29,66,138,0.6)
                    - border-radius: 14px
                    - padding: 10px
                    - height: 40px
                    - display: flex
                    - justify-content: center
                    - align-items: center
                  name:
                    - font-size: 22px
                    - font-weight: 900
                    - color: white
                    - text-align: center
                    - letter-spacing: 1px
              - type: custom:button-card
                template: round2_cf_grid
                variables:
                  side: west
                custom_fields:
                  r2w1:
                    card:
                      type: custom:button-card
                      template: tournament_game_logic
                      variables:
                        side: west
                        round: '2'
                        game_num: '1'
                  r2w2:
                    card:
                      type: custom:button-card
                      template: tournament_game_logic
                      variables:
                        side: west
                        round: '2'
                        game_num: '2'
                  w_title:
                    card:
                      type: custom:button-card
                      template: nba_title_bar
                      name: WESTERN FINALS
                  w_cf:
                    card:
                      type: custom:button-card
                      template: tournament_game_logic
                      variables:
                        side: west
                        round: '3'
                        game_num: cf

          # ══════════════════════════════════════════════════════
          # COLONNE 3 — Bannière NBA Finals + Finale
          # ══════════════════════════════════════════════════════
          - type: vertical-stack
            cards:
              - type: custom:button-card
                name: >
                  <div style="display:flex; flex-direction:column;
                  align-items:center; justify-content:center;">
                    <div style="background: linear-gradient(180deg, #1a1a1a 0%, #000 100%);
                                border: 2px solid rgba(255,215,0,0.4);
                                border-radius: 14px; padding: 2vh 2vh; width: 100%;
                                display:flex; flex-direction:column; align-items:center;
                                box-shadow: 0 0 14px rgba(0,0,0,0.6);">
                      <div style="font-size: 5vh; margin-bottom: 1vh;">🏆</div>
                      <div style="font-size: 2.6vh; font-weight: 900; letter-spacing: 1px;
                                  color: #FFD700; text-transform: uppercase;
                                  text-align: center; white-space: nowrap;">
                        NBA Finals
                      </div>
                      <div style="font-size: 2.8vh; font-weight: 800;
                                  color: #d4d4d4; margin-top: 0.5vh;">
                        2026
                      </div>
                    </div>
                  </div>
                styles:
                  card:
                    - background: none
                    - border: none
                    - box-shadow: none
                    - padding: 0
                    - height: 35vh
                    - display: flex
                    - justify-content: center
                    - align-items: center
                  name:
                    - justify-self: center
                    - text-align: center
                    - width: 100%
              - type: custom:button-card
                template: tournament_game_logic
                variables:
                  side: final
                  round: '4'

          # ══════════════════════════════════════════════════════
          # COLONNE 4 — EAST conf header + R2 + CF
          # ══════════════════════════════════════════════════════
          - type: vertical-stack
            cards:
              - type: custom:button-card
                name: EASTERN CONFERENCE
                show_icon: false
                show_state: false
                styles:
                  card:
                    - background: 'linear-gradient(180deg, #7A0000 0%, #4A0000 100%)'
                    - border: 2px solid rgba(206,17,65,0.6)
                    - border-radius: 14px
                    - padding: 10px
                    - height: 40px
                    - display: flex
                    - justify-content: center
                    - align-items: center
                  name:
                    - font-size: 22px
                    - font-weight: 900
                    - color: white
                    - text-align: center
                    - letter-spacing: 1px
              - type: custom:button-card
                template: round2_cf_grid
                variables:
                  side: east
